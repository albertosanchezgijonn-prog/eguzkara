<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#58cc02">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>eGuzkara</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--g:#58cc02;--gd:#46a302;--b:#1cb0f6;--r:#ff4b4b;--rd:#d33131;--y:#ffc800;--bg:#fff;--fg:#3c3c3c;--mut:#777;--card:#f7f7f7;--bd:#e5e5e5;--sel:#ddf4ff;--selb:#84d8ff}
@media(prefers-color-scheme:dark){:root{--bg:#131f24;--fg:#eaf2f5;--mut:#9fb0b8;--card:#1f2f36;--bd:#2f434c;--sel:#17323d;--selb:#1cb0f6}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
#app{max-width:640px;margin:0 auto;min-height:100vh;padding-bottom:84px}
.page{padding:14px 16px 24px}
h2{margin:.6em 0 .4em;font-size:1.35rem}h3{margin:1.2em 0 .4em}
.hint{color:var(--mut);font-size:.9rem;margin:.4em 0}
.warn{background:#fff4cc;color:#6b5200;border-radius:12px;padding:10px 12px;margin:10px 0;font-size:.88rem}
.stats{display:flex;gap:10px;align-items:center;font-weight:700;margin-bottom:8px;flex-wrap:wrap}
.goal{position:relative;flex:1;min-width:120px;height:22px;background:var(--bd);border-radius:11px;overflow:hidden}
.goal i{position:absolute;left:0;top:0;bottom:0;background:var(--y)}.goal em{position:relative;font-size:.72rem;font-style:normal;line-height:22px;padding-left:8px;color:#333}
.seg{display:flex;gap:8px;margin:10px 0}.seg button{flex:1;padding:10px;border:2px solid var(--bd);border-radius:12px;background:var(--card);color:var(--fg);font-weight:800;font-size:1rem}
.seg button.on{background:var(--b);border-color:var(--b);color:#fff}
.unit{border:2px solid var(--bd);border-radius:16px;padding:12px;margin:12px 0;background:var(--card)}
.unit.locked{opacity:.55}
.uh{display:flex;align-items:center;gap:10px}.uic{font-size:1.8rem}.ut{flex:1;display:flex;flex-direction:column}.ut small{color:var(--mut)}
.prog{height:8px;background:var(--bd);border-radius:6px;margin:10px 0;overflow:hidden}.prog i{display:block;height:100%;background:var(--g)}
.lessons{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ls{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:14px;border:2px solid var(--bd);border-bottom-width:4px;background:var(--bg);color:var(--fg);font-size:.72rem;min-height:74px}
.ls.done{border-color:var(--g)}.ls .lic{font-size:1.4rem}.ls .st{color:var(--y);font-size:.8rem;min-height:1em}.ls.lock{filter:grayscale(1)}
.link{background:none;border:0;color:var(--b);font-weight:700;padding:6px;font-size:.9rem}
.btn{display:block;width:100%;padding:14px;border-radius:14px;border:2px solid var(--bd);border-bottom-width:4px;font-weight:800;font-size:1rem;margin:10px 0;background:var(--bg);color:var(--fg);text-transform:uppercase;letter-spacing:.03em}
.btn.primary{background:var(--g);border-color:var(--gd);color:#fff}.btn.danger{background:var(--r);border-color:var(--rd);color:#fff}
.btn.ghost{text-transform:none}.btn:disabled{background:var(--bd);border-color:var(--bd);color:var(--mut)}
.btn.play{background:var(--b);border-color:#1590c8;color:#fff;text-transform:none}
.card{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:14px;margin:10px 0;border:2px solid var(--bd);border-bottom-width:4px;border-radius:16px;background:var(--card);color:var(--fg)}
.cic{font-size:1.8rem}.ctx{display:flex;flex-direction:column}.ctx small{color:var(--mut)}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px solid var(--bd);gap:10px}
.okw{color:var(--gd);font-weight:700}.badw{color:var(--r);font-weight:700}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--bg);border-top:2px solid var(--bd);max-width:640px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--mut);padding:8px 0;font-size:.7rem;font-weight:700}
.tab.on{color:var(--b)}.ti{font-size:1.4rem}
/* lección */
.lesson{display:flex;flex-direction:column;min-height:100vh;max-width:640px;margin:0 auto}
.top{display:flex;align-items:center;gap:12px;padding:14px 16px}.x{border:0;background:none;color:var(--mut);font-size:1.3rem}
.bar{flex:1;height:16px;background:var(--bd);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g);transition:width .3s}
.hearts{font-weight:800;color:var(--r)}.sec{font-size:.7rem;color:var(--mut);max-width:90px}
.exbody{flex:1;padding:6px 18px 18px}
.q{font-size:1.25rem;margin:.4em 0}.qrow{display:flex;align-items:center;gap:10px;justify-content:space-between}
.q2{font-weight:700;margin:14px 0 8px}.src{font-size:1.1rem;background:var(--card);padding:12px;border-radius:12px}
.say{font-size:1.5rem;font-weight:800;margin:10px 0;color:var(--b)}
.fl{font-size:1.25rem;line-height:2}.blank{display:inline-block;min-width:80px;border-bottom:3px solid var(--selb);text-align:center;font-weight:800;color:var(--b)}
.opts{display:grid;gap:10px;margin:14px 0}.opt{padding:14px;border-radius:14px;border:2px solid var(--bd);border-bottom-width:4px;background:var(--bg);color:var(--fg);font-size:1.05rem;text-align:left}
.opt.sel{background:var(--sel);border-color:var(--selb)}.opt.ok{background:#d7ffb8;border-color:var(--g);color:#235a00}.opt.bad{background:#ffdfe0;border-color:var(--r);color:#8a1c1c}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}.col{display:grid;gap:10px;align-content:start}
.inp{width:100%;padding:14px;border-radius:14px;border:2px solid var(--bd);background:var(--card);color:var(--fg);font-size:1.1rem;margin:8px 0}.area{resize:vertical}
.ans{min-height:58px;border-top:2px solid var(--bd);border-bottom:2px solid var(--bd);padding:8px 0;margin:14px 0;display:flex;flex-wrap:wrap;gap:8px}
.pool{display:flex;flex-wrap:wrap;gap:8px}.tok{padding:10px 14px;border-radius:12px;border:2px solid var(--bd);border-bottom-width:4px;background:var(--bg);color:var(--fg);font-size:1.05rem}.tok.used{opacity:.25}
.spk{border:0;background:var(--b);color:#fff;border-radius:50%;width:48px;height:48px;font-size:1.3rem;margin-right:10px}.spk.slow{background:#8e8e8e}
.big{display:flex;align-items:center;gap:6px;margin:10px 0}
.mic{border:0;background:var(--r);color:#fff;border-radius:50%;width:64px;height:64px;font-size:1.8rem;margin-left:auto}.mic.rec{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.15);box-shadow:0 0 0 12px rgba(255,75,75,.25)}}
.words{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.w{padding:4px 8px;border-radius:8px;font-weight:700}.w.okw{background:#d7ffb8;color:#235a00}.w.badw{background:#ffdfe0;color:#8a1c1c}
.dlg{background:var(--card);border-radius:12px;padding:6px 12px;margin:10px 0}.line{margin:.4em 0}
.selfrow{display:flex;gap:8px}.selfrow .btn{margin:6px 0}
.foot{position:sticky;bottom:0;background:var(--bg);padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:2px solid var(--bd)}
.fb{display:none;padding:10px 12px;border-radius:12px;margin-bottom:6px}.fb.show{display:block}.fb.good{background:#d7ffb8;color:#235a00}.fb.wrong{background:#ffdfe0;color:#8a1c1c}
.corr{font-weight:800;font-size:1.1rem;margin:4px 0}.note{font-size:.9rem}
.fb .spk{width:38px;height:38px;font-size:1rem;margin:4px 6px 0 0}
.center{text-align:center;padding:48px 24px}.emoji{font-size:4rem}.stars{font-size:2.2rem;color:var(--y)}.xp{font-weight:800;color:var(--y);font-size:1.3rem}
article.note{background:var(--card);border-radius:14px;padding:4px 14px 10px;margin:10px 0;line-height:1.5;font-size:.95rem}
article.note table{border-collapse:collapse;width:100%;margin:8px 0;font-size:.85rem;display:block;overflow-x:auto}
article.note th,article.note td{border:1px solid var(--bd);padding:5px 7px;text-align:center}article.note th{background:var(--sel)}
article.note h4{margin:.9em 0 .3em;color:var(--gd)}article.note ul{padding-left:18px}
details.gd{border:2px solid var(--bd);border-radius:14px;margin:8px 0;padding:6px 12px}details.gd summary{font-weight:700;padding:8px 0}
.lbl{display:block;margin:10px 0}.lbl.row{display:flex}.skip{display:block;margin:10px auto}

/* ---------- Guzki ---------- */
.guz{width:100%;height:auto;display:block;overflow:visible}
.guzki-art{width:100%;height:auto;aspect-ratio:1/1;object-fit:contain;display:block;border-radius:14px}
.g-all{transform-origin:100px 224px;animation:gz-bob 3s ease-in-out infinite}
.g-eyes.blink{transform-origin:100px 88px;animation:gz-blink 4.2s infinite}
.g-armR{transform-origin:138px 162px}.g-armL{transform-origin:62px 162px}
.m-acierto .g-all{animation:gz-jump .7s ease-out 2,gz-bob 3s 1.4s ease-in-out infinite}
.m-acierto .g-armR{animation:gz-wave .7s ease-in-out infinite}.m-acierto .g-armL{animation:gz-wave2 .7s ease-in-out infinite}
.m-racha .g-all{animation:gz-jump .6s ease-out 3,gz-pulse 1.2s 1.8s ease-in-out infinite}
.m-racha .g-armR{animation:gz-wave .5s ease-in-out infinite}
.m-bien .g-all{animation:gz-pop .5s ease-out 1,gz-bob 3s .5s ease-in-out infinite}
.m-sorpresa .g-all{animation:gz-pop .45s ease-out 1}
.m-duda .g-head{transform-origin:100px 130px;animation:gz-sway 2.6s ease-in-out infinite}
.m-depresivo .g-all{animation:gz-droop 4s ease-in-out infinite}
.m-depresivo .g-head{transform-origin:100px 130px;animation:gz-sway 5s ease-in-out infinite}
.m-toxico .g-all{animation:gz-sway 3.4s ease-in-out infinite}
.m-impaciente .g-bootR{transform-origin:115px 208px;animation:gz-tap .6s infinite}
.m-enfadado .g-all{animation:gz-shake 1.6s linear infinite}
.m-euforia .g-all{animation:gz-jump .8s ease-out 2,gz-pulse 1.4s 1.6s ease-in-out infinite}
.m-euforia .g-armR,.m-euforia .g-armL{animation:none}
.g-rays{transform-origin:100px 92px;animation:gz-spin 14s linear infinite}
.g-sp{transform-box:fill-box;transform-origin:center;animation:gz-tw 1.4s ease-in-out infinite}
.g-mark{animation:gz-tw .7s ease-in-out infinite}
.g-steam{animation:gz-steam 1.6s ease-out infinite}
.g-rain line{animation:gz-rain 1.2s ease-in infinite}
@keyframes gz-bob{50%{transform:translateY(-3px)}}
@keyframes gz-jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-16px)}}
@keyframes gz-pop{0%{transform:scale(.88)}55%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes gz-pulse{50%{transform:scale(1.04)}}
@keyframes gz-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes gz-droop{50%{transform:translateY(3px)}}
@keyframes gz-shake{0%,40%,100%{transform:translateX(0)}5%,15%,25%,35%{transform:translateX(-3px)}10%,20%,30%{transform:translateX(3px)}}
@keyframes gz-wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-16deg)}}
@keyframes gz-wave2{0%,100%{transform:rotate(0)}50%{transform:rotate(16deg)}}
@keyframes gz-tap{0%,60%,100%{transform:rotate(0)}30%{transform:rotate(-16deg)}}
@keyframes gz-blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes gz-spin{to{transform:rotate(360deg)}}
@keyframes gz-tw{50%{opacity:.25;transform:scale(.75)}}
@keyframes gz-rain{0%{transform:translateY(-4px);opacity:0}30%{opacity:1}100%{transform:translateY(16px);opacity:0}}
@keyframes gz-steam{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-14px);opacity:0}}
@media(prefers-reduced-motion:reduce){.guz *{animation:none!important}}
.guz-card{display:flex;gap:10px;align-items:flex-end;background:#FEF7E8;border:2px solid #f1dfba;border-radius:18px;padding:10px 12px;margin:10px 0;color:#3c3c3c}
.guz-fig{width:112px;flex:none;cursor:pointer;-webkit-user-select:none;user-select:none}
.guz-side{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0;padding-bottom:6px}
.bubble{position:relative;background:#fff;border:2px solid #e6d3aa;border-radius:14px;padding:10px 12px;color:#3c3c3c;font-weight:700;font-size:.95rem;line-height:1.3}
.guz-side .bubble:after{content:"";position:absolute;left:-9px;bottom:14px;width:14px;height:14px;background:#fff;border-left:2px solid #e6d3aa;border-bottom:2px solid #e6d3aa;transform:rotate(45deg)}
.bubble.solo{display:inline-block;margin:6px 0}
.hp{display:flex;align-items:center;gap:8px;font-size:.78rem;font-weight:800;color:#166534}
.hpbar{flex:1;height:10px;background:#eadfc4;border-radius:6px;overflow:hidden}.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#FBBF24,#22C55E)}
.gz-mini{width:46px;flex:none;border:0;background:none;padding:0}
.gz-bub{position:absolute;top:64px;right:12px;max-width:230px;background:#fff;color:#3c3c3c;border:2px solid #e6d3aa;border-radius:14px;padding:8px 12px;font-weight:700;font-size:.9rem;z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.lesson{position:relative}
.fbrow{display:flex;gap:10px;align-items:flex-start}.fb-guz{width:60px;flex:none}.fbtxt{flex:1;min-width:0}
.gmsg{font-weight:800;font-size:.85rem;margin-top:4px;opacity:.9}
.guz-big{width:170px;margin:0 auto}
.galeria{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 0}.gcell{text-align:center;font-size:.75rem}
</style>
</head>
<body>
<div id="app"></div>
<noscript>Esta aplicación necesita JavaScript.</noscript>
<script src="core.js"></script>
<script src="guzki.js"></script>
<script src="content_a1a.js"></script>
<script src="content_a1b.js"></script>
<script src="content_a2a.js"></script>
<script src="content_a2b.js"></script>
<script src="content_b1.js"></script>
<script src="content_b2.js"></script>
<script src="app.js"></script>
</body>
</html>
